# Load balancer in front of the app replicas.
# `resolve` (nginx >= 1.27.3) re-reads Docker DNS, so restarted replicas with new IPs rejoin.
resolver 127.0.0.11 valid=1s ipv6=off;

upstream app {
    zone app 64k;
    # max_fails=0: never park a replica; with two replicas, parking both on a restart race gave 502s.
    server app:8080 resolve max_fails=0;
}

server {
    listen 8080;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A replica that is shutting down refuses new connections; nginx moves the
        # request to the next replica. POST /api/chat is retried only when it never
        # reached a replica (nginx default for non-idempotent requests).
        proxy_next_upstream error timeout;
        proxy_connect_timeout 1s; # a replaced replica's old IP times out fast and the next one is tried
        proxy_read_timeout 200s;
        # During a restart nginx can hold only a vanished replica's IP for ~1s and answer
        # "no live upstreams". Its own 502 (never the app's: proxy_intercept_errors is off)
        # gets one more pass after a fresh lookup.
        error_page 502 = @retry;
    }

    location @retry {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout;
        proxy_connect_timeout 1s;
        proxy_read_timeout 200s;
    }
}
