<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16181D">
<title>알비온 코치</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <span class="brand">알비온 코치</span>
  <nav class="tabs" role="tablist" aria-label="화면 전환">
    <button role="tab" id="tab-calc" aria-controls="pane-calc" aria-selected="true">정제 계산기</button>
    <button role="tab" id="tab-coach" aria-controls="pane-coach" aria-selected="false">코치</button>
  </nav>
  <span class="server" title="Albion Online Asia 서버 시세">Asia 서버</span>
</header>

<main class="panes">
  <section id="pane-calc" class="pane calc" role="tabpanel" aria-labelledby="tab-calc">
    <form id="filters" class="filters" aria-label="정제 조건">
      <fieldset class="seg" aria-label="자원">
        <label><input type="radio" name="resource" value="ore" checked><span>광석</span></label>
        <label><input type="radio" name="resource" value="wood"><span>목재</span></label>
        <label><input type="radio" name="resource" value="fiber"><span>섬유</span></label>
        <label><input type="radio" name="resource" value="hide"><span>생가죽</span></label>
        <label><input type="radio" name="resource" value="rock"><span>돌</span></label>
      </fieldset>
      <label class="sel">티어
        <select name="tier">
          <option value="2">T2</option><option value="3">T3</option><option value="4" selected>T4</option>
          <option value="5">T5</option><option value="6">T6</option><option value="7">T7</option><option value="8">T8</option>
        </select>
      </label>
      <label class="sel">인챈트
        <select name="enchant">
          <option value="0" selected>.0</option><option value="1">.1</option><option value="2">.2</option><option value="3">.3</option><option value="4">.4</option>
        </select>
      </label>
      <label class="sel" title="게임 제작소 창에 나오는 영양 100당 은화. 모르면 0으로 두세요">사용료
        <input type="number" name="fee" min="0" max="5000" step="50" value="0" inputmode="numeric">
      </label>
      <label class="chk"><input type="checkbox" name="premium" checked><span>프리미엄</span></label>
      <label class="chk"><input type="checkbox" name="focus"><span>포커스 사용</span></label>
      <label class="chk"><input type="checkbox" name="auto"><span>자동 새로고침 (5분)</span></label>
      <button type="button" id="refresh" class="ghost">시세 새로고침</button>
    </form>

    <div id="answer" class="answer" aria-live="polite"></div>

    <table class="ladder" aria-describedby="answer">
      <thead>
        <tr>
          <th scope="col">도시</th>
          <th scope="col" class="px" id="h-raw">원자재</th>
          <th scope="col" class="px" id="h-lower">하위 정제품</th>
          <th scope="col" class="px" id="h-product">정제품</th>
          <th scope="col" class="pl">개당 손익</th>
          <th scope="col" class="axis-h"><span class="sr">손익 막대</span></th>
          <th scope="col" class="age-h">갱신</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="route" class="route"></p>
    <p id="autonote" class="source" aria-live="polite"></p>
    <p class="source">시세: <a href="https://www.albion-online-data.com/" target="_blank" rel="noopener">Albion Online Data Project</a> (플레이어가 수집한 데이터라 늦거나 빠진 값이 있을 수 있음). 6시간 안의 주문가가 없으면 최근 7일 중 마지막 하루 평균 거래가를 회색으로 씁니다. 정제는 판매 주문으로 파는 것을 기준으로 계산합니다.</p>
  </section>

  <section id="pane-coach" class="pane coach" role="tabpanel" aria-labelledby="tab-coach">
    <ol id="log" class="log" aria-live="polite"></ol>
    <div id="starters" class="starters">
      <p class="starters-lead">무엇이든 물어보세요. 시세와 공개 캐릭터 명성을 확인해서 답합니다.</p>
      <button type="button" class="starter">첫날 뭐부터 해야 해?</button>
      <button type="button" class="starter">T4 광석 지금 정제하면 이득이야?</button>
      <button type="button" class="starter">채집이랑 전투 중에 뭘 먼저 키워야 해?</button>
    </div>
    <form id="ask" class="ask">
      <label for="q" class="sr">질문</label>
      <textarea id="q" name="q" rows="2" maxlength="8000" placeholder="예: 내 캐릭터 이름은 ○○○, 다음 목표 추천해줘" required></textarea>
      <div class="ask-row">
        <button type="button" id="clear" class="ghost">대화 지우기</button>
        <button type="submit" id="send">보내기</button>
      </div>
    </form>
  </section>
</main>
<script src="app.js" defer></script>
</body>
</html>
